version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope # -> "chore(deps): bump ...", which passes the PR title check
  # stack ecosystems are appended here (npm, maven, bundler, swift, pip, gomod, mix, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # 7.x is the native compiler, with no JavaScript API to call.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope
