name: Early adopter report
description: Report how the pack worked in a real project
labels: [early-adopter]
assignees: [yutna]
body:
  - type: textarea
    id: asked
    attributes:
      label: What was asked of the agent
      description: The prompt or task the agent received.
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill opened
      description: The skill the agent opened, or none.
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What it did
      description: What the agent did, including the files it changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected instead
      description: The answer or change you expected.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. v0.16.0
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model that ran the agent.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: This report is public.
      options:
        - label: The report holds no private code or patient data.
          required: true
