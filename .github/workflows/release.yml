name: release
on:
  milestone:
    types: [closed]
permissions: {}
jobs:
  release:
    uses: yutna/oss-kit/.github/workflows/release.yml@main
    permissions:
      contents: write
      issues: write
    with:
      preflight: >-
        test "$(jq -r .version package.json)" = "$VERSION" &&
        test "$(jq -r '.plugins[].version' .claude-plugin/marketplace.json | sort -u)" = "$VERSION" &&
        test "$(jq -r .version plugins/*/.claude-plugin/plugin.json | sort -u)" = "$VERSION"
