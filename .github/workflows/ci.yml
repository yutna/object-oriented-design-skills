name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject markdownlint configuration
        run: |
          if git ls-files | grep -E '(^|/)\.markdownlint'; then
            echo "A markdownlint configuration file is tracked; default rules only."
            exit 1
          fi
          if git grep -nE 'markdownlint-(disable|enable|capture|restore|configure)' -- ':!.github/workflows/ci.yml'; then
            echo "An inline markdownlint suppression was found."
            exit 1
          fi
          echo "No markdownlint configuration or suppression found."
      - name: Run the gate
        run: npm run gate
      - name: Confirm local-only notes are untracked
        run: |
          if git ls-files -- OOP_SOURCES.md PRIVATE-NOTES.md .claude/work | grep -q .; then
            git ls-files -- OOP_SOURCES.md PRIVATE-NOTES.md .claude/work
            echo "Local-only notes must never be committed."
            exit 1
          fi
          echo "Local-only notes are untracked."
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Convert text files to CRLF
        shell: pwsh
        run: |
          $files = git ls-files -- '*.md' '*.json' '*.yml' '*.yaml'
          $count = 0
          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file)
            $text = $text -replace "`r`n", "`n"
            $text = $text -replace "`n", "`r`n"
            [System.IO.File]::WriteAllText($file, $text)
            $count++
          }
          Write-Host "converted $count file(s)"
          if ($count -eq 0) {
            throw 'No tracked text files were converted to CRLF.'
          }
      - name: Run the gate
        run: npm run gate
  # ci-ok is the one required check: add every job above to its needs.
  ci-ok:
    if: always()
    needs: [actionlint, verify, windows]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
