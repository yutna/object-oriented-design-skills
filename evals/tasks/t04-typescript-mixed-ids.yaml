schema_version: "1.1"
name: t04-typescript-mixed-ids
description: >-
  Task (oo-typescript rule 1): identifiers of two kinds that the
  compiler tells apart.
tags: [task]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    A bug report says `bookSlot` was once called with the slot id
    and the patient id swapped, and nothing caught it. Make the
    compiler reject a patient id where a slot id is expected, and a
    slot id where a patient id is expected. Declare the id types in
    `src/domain/ids.ts`.
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: loaded-any-skill
    type: tool_used
    tool: Skill
  - name: loaded-typescript
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?oo-typescript"'
  - name: ids-the-compiler-tells-apart
    type: llm
    focus: { source: file, path: src/domain/ids.ts }
    criteria: |
      You are grading the id types of a TypeScript clinic project,
      added to stop a patient id and a slot id from being swapped.

      PASS if the file declares a patient id type and a slot id
      type that the compiler tells apart from each other and from a
      plain `string`, such as branded types
      (`string & { readonly brand: 'PatientId' }`) or classes with
      a private member. FAIL if the file is missing, or if the types
      are aliases of `string` (`type PatientId = string`), which the
      compiler treats as the same type.
  - name: factory-checks-the-text
    type: llm
    focus: { source: file, path: src/domain/ids.ts }
    criteria: |
      You are grading the id types of a TypeScript clinic project,
      added to stop a patient id and a slot id from being swapped.

      PASS if every function that turns text into a patient id or a
      slot id checks the text before it asserts the brand, and
      refuses text that cannot be an id, such as blank text, by
      throwing; and the brand is asserted nowhere else in the file.
      FAIL if a factory returns the text cast to the id type with no
      check, or if the file has no such function.
